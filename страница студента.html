<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой профиль — Professional English</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <style>
        /* ===================== ТЕМЫ ===================== */
        :root,
        [data-theme="dark"] {
            --bg: #0b0f1a;
            --surface: #111827;
            --surface2: #1a2236;
            --border: rgba(255,255,255,0.07);
            --border2: rgba(99,210,255,0.18);
            --accent: #63d2ff;
            --accent2: #a78bfa;
            --pink: #f472b6;
            --green: #34d399;
            --red: #fb7185;
            --orange: #fb923c;
            --text: #e2e8f0;
            --muted: #64748b;
            --card-glow: rgba(99,210,255,0.06);
            --header-bg: rgba(11,15,26,0.85);
            --grid-lines: rgba(99,210,255,0.03);
            --shadow: rgba(0,0,0,0.3);
            --input-bg: rgba(255,255,255,0.04);
        }

        [data-theme="light"] {
            --bg: #f1f5f9;
            --surface: #ffffff;
            --surface2: #f8fafc;
            --border: rgba(0,0,0,0.06);
            --border2: rgba(59,130,246,0.25);
            --accent: #2563eb;
            --accent2: #7c3aed;
            --pink: #db2777;
            --green: #059669;
            --red: #dc2626;
            --orange: #ea580c;
            --text: #1e293b;
            --muted: #64748b;
            --card-glow: rgba(59,130,246,0.04);
            --header-bg: rgba(255,255,255,0.9);
            --grid-lines: rgba(0,0,0,0.02);
            --shadow: rgba(0,0,0,0.08);
            --input-bg: rgba(0,0,0,0.02);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            transition: background 0.3s, color 0.3s;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(var(--grid-lines) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-lines) 1px, transparent 1px);
            background-size: 48px 48px;
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            top: -20%;
            left: 50%;
            transform: translateX(-50%);
            width: 900px;
            height: 500px;
            background: radial-gradient(ellipse, var(--card-glow) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        /* HEADER */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(20px) saturate(180%);
            background: var(--header-bg);
            border-bottom: 1px solid var(--border);
            transition: background 0.3s, border-color 0.3s;
        }

        .header-inner {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 32px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            cursor: pointer;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: #fff;
            transition: transform 0.3s;
        }

        .logo:hover .logo-icon {
            transform: scale(1.1);
        }

        .logo-text {
            font-family: 'DM Serif Display', serif;
            font-size: 1.25rem;
            color: var(--text);
            letter-spacing: -0.01em;
            transition: color 0.3s;
        }

        .logo-text span {
            color: var(--accent);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* THEME TOGGLE */
        .theme-toggle {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: var(--surface2);
            border: 1px solid var(--border);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: all 0.3s;
            color: var(--text);
        }

        .theme-toggle:hover {
            background: var(--surface);
            border-color: var(--accent);
            transform: scale(1.05);
        }

        .theme-toggle .fa-sun,
        .theme-toggle .fa-moon {
            font-size: 1rem;
            position: absolute;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="dark"] .theme-toggle .fa-sun {
            opacity: 1;
            transform: rotate(0) scale(1);
        }
        [data-theme="dark"] .theme-toggle .fa-moon {
            opacity: 0;
            transform: rotate(90deg) scale(0);
        }
        [data-theme="light"] .theme-toggle .fa-sun {
            opacity: 0;
            transform: rotate(-90deg) scale(0);
        }
        [data-theme="light"] .theme-toggle .fa-moon {
            opacity: 1;
            transform: rotate(0) scale(1);
            color: #6366f1;
        }

        /* USER PROFILE IN HEADER */
        .user-profile-mini {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 16px 6px 12px;
            border-radius: 100px;
            background: var(--surface2);
            border: 1px solid var(--border);
        }

        .user-avatar-mini {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #fff;
            font-weight: 600;
        }

        .user-name-mini {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text);
        }

        .user-role-badge-mini {
            font-size: 0.55rem;
            padding: 2px 10px;
            border-radius: 100px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .user-role-badge-mini.student {
            background: rgba(52, 211, 153, 0.15);
            color: var(--green);
            border: 1px solid rgba(52, 211, 153, 0.25);
        }

        .user-role-badge-mini.teacher {
            background: rgba(167, 139, 250, 0.15);
            color: var(--accent2);
            border: 1px solid rgba(167, 139, 250, 0.25);
        }

        /* MAIN CONTENT */
        main {
            position: relative;
            z-index: 1;
            max-width: 1280px;
            margin: 0 auto;
            padding: 40px 32px 100px;
        }

        /* PROFILE HEADER */
        .profile-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 30px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .profile-info {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .profile-avatar-large {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: #fff;
            font-weight: 600;
            flex-shrink: 0;
        }

        .profile-details h1 {
            font-family: 'DM Serif Display', serif;
            font-size: 2rem;
            font-weight: 400;
            color: var(--text);
            margin-bottom: 4px;
        }

        .profile-details .email {
            color: var(--muted);
            font-size: 0.9rem;
        }

        .profile-details .role-tag {
            display: inline-block;
            margin-top: 8px;
            padding: 4px 16px;
            border-radius: 100px;
            font-size: 0.75rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .role-tag.student {
            background: rgba(52, 211, 153, 0.12);
            color: var(--green);
            border: 1px solid rgba(52, 211, 153, 0.2);
        }

        .role-tag.teacher {
            background: rgba(167, 139, 250, 0.12);
            color: var(--accent2);
            border: 1px solid rgba(167, 139, 250, 0.2);
        }

        .profile-stats {
            display: flex;
            gap: 40px;
            padding: 16px 32px;
            background: var(--surface);
            border-radius: 16px;
            border: 1px solid var(--border);
            flex-shrink: 0;
        }

        .profile-stat {
            text-align: center;
        }

        .profile-stat .num {
            font-family: 'DM Serif Display', serif;
            font-size: 1.8rem;
            color: var(--text);
            display: block;
        }

        .profile-stat .label {
            font-size: 0.75rem;
            color: var(--muted);
            font-weight: 300;
        }

        /* SECTION TITLE */
        .section-title {
            font-family: 'DM Serif Display', serif;
            font-size: 1.5rem;
            font-weight: 400;
            color: var(--text);
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .section-title .count {
            font-family: 'DM Sans', sans-serif;
            font-size: 0.8rem;
            color: var(--muted);
            font-weight: 300;
        }

        /* COURSES GRID */
        .courses-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 24px;
        }

        /* COURSE CARD */
        .course-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 24px;
            transition: all 0.3s;
        }

        .course-card:hover {
            border-color: var(--border2);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px var(--shadow);
        }

        .course-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .course-card-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .course-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #fff;
            flex-shrink: 0;
        }

        .course-icon.medical {
            background: linear-gradient(135deg, #63d2ff, #3b82f6);
        }

        .course-icon.culinary {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
        }

        .course-icon.tech {
            background: linear-gradient(135deg, #f472b6, #ec4899);
        }

        .course-icon.business {
            background: linear-gradient(135deg, #a78bfa, #7c3aed);
        }

        .course-icon.law {
            background: linear-gradient(135deg, #fb923c, #f97316);
        }

        .course-card-title h3 {
            font-family: 'DM Serif Display', serif;
            font-size: 1.1rem;
            font-weight: 400;
            color: var(--text);
        }

        .course-progress-badge {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--muted);
            padding: 4px 12px;
            border-radius: 100px;
            background: var(--surface2);
            border: 1px solid var(--border);
        }

        .course-progress-bar {
            width: 100%;
            height: 6px;
            background: var(--surface2);
            border-radius: 99px;
            overflow: hidden;
            margin-bottom: 16px;
        }

        .course-progress-bar .fill {
            height: 100%;
            border-radius: 99px;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            transition: width 0.6s ease;
        }

        .course-progress-bar .fill.completed {
            background: var(--green);
        }

        /* DROPDOWN SELECT */
        .lesson-select {
            width: 100%;
            padding: 10px 14px;
            border-radius: 12px;
            background: var(--surface2);
            color: var(--text);
            border: 1px solid var(--border);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.9rem;
            outline: none;
            cursor: pointer;
            transition: border-color 0.3s;
            margin-top: 8px;
        }
        .lesson-select:hover,
        .lesson-select:focus {
            border-color: var(--accent);
        }
        .lesson-select option {
            background: var(--surface);
            color: var(--text);
            padding: 6px;
        }

        .lesson-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: var(--muted);
            margin-top: 12px;
        }

        /* LOGOUT BUTTON */
        .logout-btn {
            padding: 10px 28px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--surface2);
            color: var(--red);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logout-btn:hover {
            background: rgba(251, 113, 133, 0.08);
            border-color: var(--red);
            transform: translateY(-1px);
        }

        .logout-btn:active {
            transform: scale(0.96);
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .header-inner {
                padding: 0 16px;
            }

            main {
                padding: 24px 16px 60px;
            }

            .profile-header {
                flex-direction: column;
                align-items: stretch;
            }

            .profile-info {
                flex-direction: column;
                text-align: center;
            }

            .profile-stats {
                justify-content: center;
                gap: 20px;
                padding: 12px 20px;
            }

            .courses-grid {
                grid-template-columns: 1fr;
            }

            .profile-details h1 {
                font-size: 1.5rem;
            }

            .user-name-mini {
                display: none;
            }

            .user-role-badge-mini {
                display: none;
            }
        }

        @media (max-width: 480px) {
            .profile-stats {
                flex-wrap: wrap;
                gap: 12px;
            }

            .profile-stat .num {
                font-size: 1.3rem;
            }

            .course-card {
                padding: 16px;
            }

            .logout-btn {
                padding: 8px 16px;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-inner">
            <a href="index.html" class="logo">
                <div class="logo-icon"><i class="fas fa-globe"></i></div>
                <span class="logo-text">Professional <span>English</span></span>
            </a>
            <div class="header-right">
                <!-- Мини-профиль в шапке -->
                <div class="user-profile-mini">
                    <div class="user-avatar-mini" id="headerAvatar">А</div>
                    <span class="user-name-mini" id="headerName">Анна</span>
                    <span class="user-role-badge-mini student" id="headerRole">Студент</span>
                </div>
                <button class="theme-toggle" id="themeToggle" title="Switch theme">
                    <i class="fas fa-sun"></i>
                    <i class="fas fa-moon"></i>
                </button>
            </div>
        </div>
    </header>

    <main>
        <!-- ===== ПРОФИЛЬ ===== -->
        <div class="profile-header">
            <div class="profile-info">
                <div class="profile-avatar-large" id="profileAvatar">А</div>
                <div class="profile-details">
                    <h1 id="profileName">Анна Смирнова</h1>
                    <div class="email" id="profileEmail">anna.smirnova@mail.ru</div>
                    <span class="role-tag student" id="profileRole">👨‍🎓 Студент</span>
                </div>
            </div>
            <div style="display:flex; gap:12px; align-items:center; flex-wrap:wrap;">
                <div class="profile-stats">
                    <div class="profile-stat">
                        <span class="num" id="statCourses">0</span>
                        <span class="label">Курса</span>
                    </div>
                    <div class="profile-stat">
                        <span class="num" id="statTopics">0</span>
                        <span class="label">Тем</span>
                    </div>
                    <div class="profile-stat">
                        <span class="num" id="statProgress">0%</span>
                        <span class="label">Прогресс</span>
                    </div>
                </div>
                <button class="logout-btn" id="logoutBtn">
                    <i class="fas fa-sign-out-alt"></i> Выйти
                </button>
            </div>
        </div>

        <!-- ===== МОИ КУРСЫ ===== -->
        <div class="section-title">
            Мои курсы <span class="count" id="coursesCount">(0)</span>
        </div>

        <div class="courses-grid" id="coursesGrid">
            <!-- Карточки будут сгенерированы динамически -->
        </div>
    </main>

    <script>
        // ========== КЛЮЧ ДЛЯ ХРАНЕНИЯ ==========
        const USER_KEY = 'profeng_user';
        const PROGRESS_PREFIX = 'lesson_progress_';

        // ========== ПОЛУЧЕНИЕ ПОЛЬЗОВАТЕЛЯ ==========
        function getUser() {
            try {
                const data = localStorage.getItem(USER_KEY);
                return data ? JSON.parse(data) : null;
            } catch {
                return null;
            }
        }

        // ========== ПРОВЕРКА АВТОРИЗАЦИИ ==========
        const user = getUser();

        if (!user) {
            alert('Пожалуйста, войдите в аккаунт.');
            window.location.href = 'index.html';
        }

        // ========== ЗАПОЛНЕНИЕ ДАННЫХ ПРОФИЛЯ ==========
        function initProfile() {
            if (!user) return;

            const nameParts = user.name.split(' ');
            const firstName = nameParts[0] || 'Пользователь';
            const fullName = user.name;
            const initials = nameParts.map(w => w[0]).join('').toUpperCase().slice(0, 2);

            document.getElementById('profileName').textContent = fullName;
            document.getElementById('profileEmail').textContent = user.email;
            document.getElementById('profileAvatar').textContent = initials;
            document.getElementById('headerAvatar').textContent = initials;
            document.getElementById('headerName').textContent = firstName;

            const roleTag = document.getElementById('profileRole');
            const headerRole = document.getElementById('headerRole');
            if (user.role === 'teacher') {
                roleTag.textContent = '👨‍🏫 Преподаватель';
                roleTag.className = 'role-tag teacher';
                headerRole.textContent = 'Преподаватель';
                headerRole.className = 'user-role-badge-mini teacher';
            } else {
                roleTag.textContent = '👨‍🎓 Студент';
                roleTag.className = 'role-tag student';
                headerRole.textContent = 'Студент';
                headerRole.className = 'user-role-badge-mini student';
            }
        }

        // ========== ТЕМА ==========
        (function() {
            const html = document.documentElement;
            const toggle = document.getElementById('themeToggle');
            const saved = localStorage.getItem('theme') || 'dark';
            html.setAttribute('data-theme', saved);

            if (toggle) {
                toggle.addEventListener('click', () => {
                    const current = html.getAttribute('data-theme');
                    const next = current === 'dark' ? 'light' : 'dark';
                    html.setAttribute('data-theme', next);
                    localStorage.setItem('theme', next);
                });
            }
        })();

        // ========== ВЫХОД ==========
        document.getElementById('logoutBtn').addEventListener('click', () => {
            if (confirm('Вы уверены, что хотите выйти из аккаунта?')) {
                localStorage.removeItem(USER_KEY);
                window.location.href = 'index.html';
            }
        });

        // ================================================================
        // 🚀 ЗАГРУЗКА ПРОГРЕССА ПО КУРСАМ
        // ================================================================

        // Определение структуры курсов
        const COURSES = [
            {
                id: 'medical',
                name: 'Medical English',
                icon: 'medical',
                iconClass: 'fa-heartbeat',
                lessonCount: 35,
                getLessonName: (num) => `Lesson ${num}`,
                getLessonLink: (num) => `medical/anatomy/${num}.html`
            }
            // В будущем можно добавить другие курсы:
            // {
            //     id: 'technical',
            //     name: 'Technical English',
            //     icon: 'tech',
            //     iconClass: 'fa-microchip',
            //     lessonCount: 10,
            //     getLessonName: (num) => `Unit ${num}`,
            //     getLessonLink: (num) => `tech/${num}.html`
            // }
        ];

        // Получить прогресс конкретного урока
        function getLessonProgress(lessonNumber) {
            const key = PROGRESS_PREFIX + lessonNumber;
            const data = localStorage.getItem(key);
            if (!data) return null;
            try {
                const parsed = JSON.parse(data);
                const exercises = parsed.exercises || {};
                const total = parsed.totalExercises || 0;
                if (total === 0) return { progress: 0, completed: 0, total: 0 };
                let completed = 0;
                for (const ex of Object.values(exercises)) {
                    if (ex.status === 'completed') completed++;
                }
                const progress = Math.round((completed / total) * 100);
                return { progress, completed, total };
            } catch {
                return null;
            }
        }

        // Получить прогресс по курсу
        function getCourseProgress(course) {
            const lessonProgress = [];
            let totalCompleted = 0;
            let totalLessons = course.lessonCount;
            let totalProgressSum = 0;

            for (let i = 1; i <= totalLessons; i++) {
                const prog = getLessonProgress(i);
                if (prog) {
                    lessonProgress.push({
                        number: i,
                        name: course.getLessonName(i),
                        link: course.getLessonLink(i),
                        progress: prog.progress,
                        completed: prog.completed,
                        total: prog.total
                    });
                    totalProgressSum += prog.progress;
                } else {
                    lessonProgress.push({
                        number: i,
                        name: course.getLessonName(i),
                        link: course.getLessonLink(i),
                        progress: 0,
                        completed: 0,
                        total: 0
                    });
                }
            }

            const avgProgress = totalLessons > 0 ? Math.round(totalProgressSum / totalLessons) : 0;
            const startedLessons = lessonProgress.filter(l => l.progress > 0).length;
            const completedLessons = lessonProgress.filter(l => l.progress === 100).length;

            return {
                course,
                lessons: lessonProgress,
                avgProgress,
                startedLessons,
                completedLessons,
                totalLessons
            };
        }

        // Рендеринг карточек курсов
        function renderCourses() {
            const grid = document.getElementById('coursesGrid');
            grid.innerHTML = '';

            let totalCourses = 0;
            let totalLessonsAll = 0;
            let totalProgressSumAll = 0;

            COURSES.forEach(course => {
                const data = getCourseProgress(course);
                totalCourses++;
                totalLessonsAll += data.totalLessons;
                totalProgressSumAll += data.avgProgress;

                const card = document.createElement('div');
                card.className = 'course-card';

                // Заголовок
                const header = document.createElement('div');
                header.className = 'course-card-header';

                const titleDiv = document.createElement('div');
                titleDiv.className = 'course-card-title';
                const iconDiv = document.createElement('div');
                iconDiv.className = `course-icon ${course.icon}`;
                iconDiv.innerHTML = `<i class="fas ${course.iconClass}"></i>`;
                const h3 = document.createElement('h3');
                h3.textContent = course.name;
                titleDiv.appendChild(iconDiv);
                titleDiv.appendChild(h3);
                header.appendChild(titleDiv);

                const badge = document.createElement('span');
                badge.className = 'course-progress-badge';
                badge.textContent = `${data.avgProgress}%`;
                header.appendChild(badge);
                card.appendChild(header);

                // Прогресс-бар
                const bar = document.createElement('div');
                bar.className = 'course-progress-bar';
                const fill = document.createElement('div');
                fill.className = 'fill';
                fill.style.width = `${data.avgProgress}%`;
                if (data.avgProgress === 100) fill.classList.add('completed');
                bar.appendChild(fill);
                card.appendChild(bar);

                // Информация о прогрессе
                const infoDiv = document.createElement('div');
                infoDiv.className = 'lesson-info';
                const infoText = document.createElement('span');
                infoText.textContent = `Пройдено ${data.completedLessons} из ${data.totalLessons} уроков`;
                infoDiv.appendChild(infoText);
                card.appendChild(infoDiv);

                // Выпадающий список уроков
                const select = document.createElement('select');
                select.className = 'lesson-select';
                select.addEventListener('change', function() {
                    if (this.value) {
                        window.location.href = this.value;
                    }
                });

                // Пустой option как заглушка
                const defaultOption = document.createElement('option');
                defaultOption.value = '';
                defaultOption.textContent = '— Выберите урок —';
                select.appendChild(defaultOption);

                // Добавляем опции для каждого урока
                data.lessons.forEach(lesson => {
                    const opt = document.createElement('option');
                    opt.value = lesson.link;
                    let statusIcon = '';
                    if (lesson.progress === 100) statusIcon = '✅ ';
                    else if (lesson.progress > 0) statusIcon = '🔄 ';
                    else statusIcon = '⏳ ';
                    opt.textContent = `${statusIcon}${lesson.name} (${lesson.progress}%)`;
                    select.appendChild(opt);
                });

                card.appendChild(select);
                grid.appendChild(card);
            });

            // Обновляем статистику в шапке
            document.getElementById('statCourses').textContent = totalCourses;
            document.getElementById('statTopics').textContent = totalLessonsAll;
            const overallProgress = totalCourses > 0 ? Math.round(totalProgressSumAll / totalCourses) : 0;
            document.getElementById('statProgress').textContent = `${overallProgress}%`;
            document.getElementById('coursesCount').textContent = `(${totalCourses})`;
        }

        // ========== ИНИЦИАЛИЗАЦИЯ ==========
        initProfile();
        renderCourses();

        console.log('✅ Страница студента загружена с выпадающим списком уроков');
        console.log('👤 Пользователь:', user);
    </script>

</body>
</html>
