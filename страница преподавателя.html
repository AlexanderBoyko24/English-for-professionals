<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Преподаватель — Professional English</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <style>
        /* ===================== ТЕМЫ ===================== */
        :root,
        [data-theme="dark"] {
            --bg: #0b0f1a;
            --surface: #111827;
            --surface2: #1a2236;
            --border: rgba(255,255,255,0.07);
            --border2: rgba(99,210,255,0.18);
            --accent: #63d2ff;
            --accent2: #a78bfa;
            --pink: #f472b6;
            --green: #34d399;
            --red: #fb7185;
            --orange: #fb923c;
            --text: #e2e8f0;
            --muted: #64748b;
            --card-glow: rgba(99,210,255,0.06);
            --header-bg: rgba(11,15,26,0.85);
            --grid-lines: rgba(99,210,255,0.03);
            --shadow: rgba(0,0,0,0.3);
            --input-bg: rgba(255,255,255,0.04);
            --modal-overlay: rgba(0,0,0,0.7);
        }

        [data-theme="light"] {
            --bg: #f1f5f9;
            --surface: #ffffff;
            --surface2: #f8fafc;
            --border: rgba(0,0,0,0.06);
            --border2: rgba(59,130,246,0.25);
            --accent: #2563eb;
            --accent2: #7c3aed;
            --pink: #db2777;
            --green: #059669;
            --red: #dc2626;
            --orange: #ea580c;
            --text: #1e293b;
            --muted: #64748b;
            --card-glow: rgba(59,130,246,0.04);
            --header-bg: rgba(255,255,255,0.9);
            --grid-lines: rgba(0,0,0,0.02);
            --shadow: rgba(0,0,0,0.08);
            --input-bg: rgba(0,0,0,0.02);
            --modal-overlay: rgba(0,0,0,0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            transition: background 0.3s, color 0.3s;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(var(--grid-lines) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-lines) 1px, transparent 1px);
            background-size: 48px 48px;
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            top: -20%;
            left: 50%;
            transform: translateX(-50%);
            width: 900px;
            height: 500px;
            background: radial-gradient(ellipse, var(--card-glow) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        /* HEADER */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(20px) saturate(180%);
            background: var(--header-bg);
            border-bottom: 1px solid var(--border);
            transition: background 0.3s, border-color 0.3s;
        }

        .header-inner {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 32px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            cursor: pointer;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: #fff;
            transition: transform 0.3s;
        }

        .logo:hover .logo-icon {
            transform: scale(1.1);
        }

        .logo-text {
            font-family: 'DM Serif Display', serif;
            font-size: 1.25rem;
            color: var(--text);
            letter-spacing: -0.01em;
            transition: color 0.3s;
        }

        .logo-text span {
            color: var(--accent);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* THEME TOGGLE */
        .theme-toggle {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: var(--surface2);
            border: 1px solid var(--border);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: all 0.3s;
            color: var(--text);
        }

        .theme-toggle:hover {
            background: var(--surface);
            border-color: var(--accent);
            transform: scale(1.05);
        }

        .theme-toggle .fa-sun,
        .theme-toggle .fa-moon {
            font-size: 1rem;
            position: absolute;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="dark"] .theme-toggle .fa-sun {
            opacity: 1;
            transform: rotate(0) scale(1);
        }
        [data-theme="dark"] .theme-toggle .fa-moon {
            opacity: 0;
            transform: rotate(90deg) scale(0);
        }
        [data-theme="light"] .theme-toggle .fa-sun {
            opacity: 0;
            transform: rotate(-90deg) scale(0);
        }
        [data-theme="light"] .theme-toggle .fa-moon {
            opacity: 1;
            transform: rotate(0) scale(1);
            color: #6366f1;
        }

        /* USER PROFILE IN HEADER */
        .user-profile-mini {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 16px 6px 12px;
            border-radius: 100px;
            background: var(--surface2);
            border: 1px solid var(--border);
        }

        .user-avatar-mini {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #fff;
            font-weight: 600;
        }

        .user-name-mini {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text);
        }

        .user-role-badge-mini {
            font-size: 0.55rem;
            padding: 2px 10px;
            border-radius: 100px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .user-role-badge-mini.teacher {
            background: rgba(167, 139, 250, 0.15);
            color: var(--accent2);
            border: 1px solid rgba(167, 139, 250, 0.25);
        }

        /* MAIN LAYOUT */
        main {
            position: relative;
            z-index: 1;
            max-width: 1280px;
            margin: 0 auto;
            padding: 40px 32px 100px;
        }

        /* PROFILE HEADER */
        .profile-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 30px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .profile-info {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .profile-avatar-large {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: #fff;
            font-weight: 600;
            flex-shrink: 0;
        }

        .profile-details h1 {
            font-family: 'DM Serif Display', serif;
            font-size: 2rem;
            font-weight: 400;
            color: var(--text);
            margin-bottom: 4px;
        }

        .profile-details .email {
            color: var(--muted);
            font-size: 0.9rem;
        }

        .profile-details .role-tag {
            display: inline-block;
            margin-top: 8px;
            padding: 4px 16px;
            border-radius: 100px;
            font-size: 0.75rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            background: rgba(167, 139, 250, 0.12);
            color: var(--accent2);
            border: 1px solid rgba(167, 139, 250, 0.2);
        }

        .logout-btn {
            padding: 10px 28px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--surface2);
            color: var(--red);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logout-btn:hover {
            background: rgba(251, 113, 133, 0.08);
            border-color: var(--red);
            transform: translateY(-1px);
        }

        .logout-btn:active {
            transform: scale(0.96);
        }

        /* TWO COLUMNS */
        .teacher-dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        @media (max-width: 900px) {
            .teacher-dashboard {
                grid-template-columns: 1fr;
            }
        }

        /* SEARCH SECTION */
        .search-section {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 24px;
        }

        .search-section h2 {
            font-family: 'DM Serif Display', serif;
            font-size: 1.3rem;
            font-weight: 400;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .search-box {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }

        .search-box input {
            flex: 1;
            padding: 12px 16px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.3s;
        }

        .search-box input:focus {
            border-color: var(--accent);
        }

        .search-box button {
            padding: 12px 20px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .search-box button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(99, 210, 255, 0.25);
        }

        .search-results {
            max-height: 400px;
            overflow-y: auto;
        }

        .search-results .empty {
            color: var(--muted);
            text-align: center;
            padding: 30px 0;
            font-size: 0.9rem;
        }

        .user-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            border-radius: 12px;
            background: var(--surface2);
            margin-bottom: 8px;
            transition: all 0.2s;
        }

        .user-item:hover {
            background: var(--input-bg);
        }

        .user-item .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-item .user-avatar-small {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #fff;
            font-weight: 600;
        }

        .user-item .user-detail {
            display: flex;
            flex-direction: column;
        }

        .user-item .user-detail .name {
            font-weight: 500;
            font-size: 0.9rem;
            color: var(--text);
        }

        .user-item .user-detail .email {
            font-size: 0.75rem;
            color: var(--muted);
        }

        .user-item .actions {
            display: flex;
            gap: 8px;
        }

        .user-item .actions button {
            padding: 6px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--surface2);
            color: var(--text);
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .user-item .actions button:hover {
            border-color: var(--accent);
            background: var(--surface);
        }

        .user-item .actions button.add-btn {
            color: var(--green);
            border-color: rgba(52, 211, 153, 0.3);
        }

        .user-item .actions button.add-btn:hover {
            background: rgba(52, 211, 153, 0.08);
            border-color: var(--green);
        }

        .user-item .actions button.view-btn {
            color: var(--accent);
            border-color: rgba(99, 210, 255, 0.3);
        }

        .user-item .actions button.view-btn:hover {
            background: rgba(99, 210, 255, 0.08);
            border-color: var(--accent);
        }

        /* GROUPS SECTION */
        .groups-section {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 24px;
        }

        .groups-section h2 {
            font-family: 'DM Serif Display', serif;
            font-size: 1.3rem;
            font-weight: 400;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .create-group-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: #fff;
            font-weight: 500;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .create-group-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(99, 210, 255, 0.25);
        }

        .group-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .group-card {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px;
            transition: all 0.2s;
        }

        .group-card:hover {
            border-color: var(--border2);
        }

        .group-card .group-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .group-card .group-name {
            font-weight: 600;
            font-size: 1rem;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .group-card .group-name .count {
            font-weight: 400;
            font-size: 0.75rem;
            color: var(--muted);
        }

        .group-card .group-actions {
            display: flex;
            gap: 6px;
        }

        .group-card .group-actions button {
            padding: 4px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--surface);
            color: var(--text);
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .group-card .group-actions button:hover {
            border-color: var(--accent);
        }

        .group-card .group-actions button.delete-group {
            color: var(--red);
            border-color: rgba(251, 113, 133, 0.3);
        }

        .group-card .group-actions button.delete-group:hover {
            background: rgba(251, 113, 133, 0.08);
            border-color: var(--red);
        }

        .group-students {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .group-student-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 12px;
            border-radius: 8px;
            background: var(--surface);
            transition: background 0.2s;
        }

        .group-student-item:hover {
            background: var(--input-bg);
        }

        .group-student-item .student-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
            color: var(--text);
        }

        .group-student-item .student-info .email {
            color: var(--muted);
            font-size: 0.75rem;
        }

        .group-student-item .student-actions {
            display: flex;
            gap: 6px;
        }

        .group-student-item .student-actions button {
            padding: 2px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--surface2);
            color: var(--text);
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .group-student-item .student-actions button:hover {
            border-color: var(--accent);
        }

        .group-student-item .student-actions button.remove-btn {
            color: var(--red);
            border-color: rgba(251, 113, 133, 0.3);
        }

        .group-student-item .student-actions button.remove-btn:hover {
            background: rgba(251, 113, 133, 0.08);
            border-color: var(--red);
        }

        .group-student-item .student-actions button.view-progress {
            color: var(--accent);
            border-color: rgba(99, 210, 255, 0.3);
        }

        .group-student-item .student-actions button.view-progress:hover {
            background: rgba(99, 210, 255, 0.08);
            border-color: var(--accent);
        }

        .empty-groups {
            color: var(--muted);
            text-align: center;
            padding: 30px 0;
            font-size: 0.9rem;
        }

        /* MODAL */
        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 999;
            background: var(--modal-overlay);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 32px;
            max-width: 500px;
            width: 92%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 32px 80px var(--shadow);
            animation: slideUp 0.35s ease;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 16px;
            right: 20px;
            background: none;
            border: none;
            color: var(--muted);
            font-size: 1.2rem;
            cursor: pointer;
            transition: color 0.2s, transform 0.2s;
        }

        .modal-close:hover {
            color: var(--text);
            transform: rotate(90deg);
        }

        .modal-title {
            font-family: 'DM Serif Display', serif;
            font-size: 1.3rem;
            font-weight: 400;
            color: var(--text);
            margin-bottom: 16px;
        }

        .modal-body {
            margin-bottom: 20px;
        }

        .modal-body label {
            display: block;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--muted);
            margin-bottom: 6px;
        }

        .modal-body input,
        .modal-body select {
            width: 100%;
            padding: 10px 14px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.3s;
        }

        .modal-body input:focus,
        .modal-body select:focus {
            border-color: var(--accent);
        }

        .modal-footer {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .modal-footer button {
            padding: 10px 24px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--surface2);
            color: var(--text);
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .modal-footer button:hover {
            border-color: var(--accent);
        }

        .modal-footer button.btn-primary {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            border: none;
            color: #fff;
        }

        .modal-footer button.btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(99, 210, 255, 0.25);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .header-inner {
                padding: 0 16px;
            }

            main {
                padding: 24px 16px 60px;
            }

            .profile-header {
                flex-direction: column;
                align-items: stretch;
            }

            .profile-info {
                flex-direction: column;
                text-align: center;
            }

            .user-name-mini {
                display: none;
            }

            .user-role-badge-mini {
                display: none;
            }

            .modal {
                padding: 24px;
                width: 95%;
            }
        }

        @media (max-width: 480px) {
            .search-box {
                flex-direction: column;
            }

            .user-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }

            .user-item .actions {
                width: 100%;
                justify-content: flex-start;
            }

            .group-student-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 6px;
            }

            .group-student-item .student-actions {
                width: 100%;
                justify-content: flex-start;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-inner">
            <a href="index.html" class="logo">
                <div class="logo-icon"><i class="fas fa-globe"></i></div>
                <span class="logo-text">Professional <span>English</span></span>
            </a>
            <div class="header-right">
                <div class="user-profile-mini">
                    <div class="user-avatar-mini" id="headerAvatar">П</div>
                    <span class="user-name-mini" id="headerName">Преподаватель</span>
                    <span class="user-role-badge-mini teacher">Преподаватель</span>
                </div>
                <button class="theme-toggle" id="themeToggle" title="Switch theme">
                    <i class="fas fa-sun"></i>
                    <i class="fas fa-moon"></i>
                </button>
            </div>
        </div>
    </header>

    <main>
        <!-- ===== ПРОФИЛЬ ===== -->
        <div class="profile-header">
            <div class="profile-info">
                <div class="profile-avatar-large" id="profileAvatar">П</div>
                <div class="profile-details">
                    <h1 id="profileName">Преподаватель</h1>
                    <div class="email" id="profileEmail">teacher@mail.ru</div>
                    <span class="role-tag">👨‍🏫 Преподаватель</span>
                </div>
            </div>
            <button class="logout-btn" id="logoutBtn">
                <i class="fas fa-sign-out-alt"></i> Выйти
            </button>
        </div>

        <!-- ===== ДАШБОРД ===== -->
        <div class="teacher-dashboard">

            <!-- ЛЕВАЯ КОЛОНКА: ПОИСК СТУДЕНТОВ -->
            <div class="search-section">
                <h2><i class="fas fa-search" style="color:var(--accent);"></i> Поиск студентов</h2>
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Имя или email студента...">
                    <button id="searchBtn"><i class="fas fa-search"></i> Найти</button>
                </div>
                <div class="search-results" id="searchResults">
                    <div class="empty">Введите имя или email для поиска</div>
                </div>
            </div>

            <!-- ПРАВАЯ КОЛОНКА: ГРУППЫ -->
            <div class="groups-section">
                <h2>
                    <span><i class="fas fa-users" style="color:var(--accent2);"></i> Мои группы</span>
                    <button class="create-group-btn" id="createGroupBtn">
                        <i class="fas fa-plus"></i> Создать группу
                    </button>
                </h2>
                <div class="group-list" id="groupList">
                    <!-- Группы будут добавлены через JS -->
                </div>
            </div>

        </div>
    </main>

    <!-- ===== МОДАЛЬНОЕ ОКНО: СОЗДАНИЕ ГРУППЫ ===== -->
    <div class="modal-overlay" id="createGroupModal">
        <div class="modal">
            <button class="modal-close" id="closeCreateGroupModal"><i class="fas fa-times"></i></button>
            <div class="modal-title">Создать новую группу</div>
            <div class="modal-body">
                <label>Название группы</label>
                <input type="text" id="newGroupName" placeholder="Введите название...">
            </div>
            <div class="modal-footer">
                <button id="cancelCreateGroup">Отмена</button>
                <button class="btn-primary" id="confirmCreateGroup">Создать</button>
            </div>
        </div>
    </div>

    <!-- ===== МОДАЛЬНОЕ ОКНО: ДОБАВЛЕНИЕ В ГРУППУ ===== -->
    <div class="modal-overlay" id="addToGroupModal">
        <div class="modal">
            <button class="modal-close" id="closeAddToGroupModal"><i class="fas fa-times"></i></button>
            <div class="modal-title">Добавить студента в группу</div>
            <div class="modal-body">
                <p style="margin-bottom:12px;color:var(--muted);">
                    Студент: <strong id="addStudentName"></strong> (<span id="addStudentEmail"></span>)
                </p>
                <label>Выберите группу</label>
                <select id="groupSelect">
                    <option value="">-- Выберите группу --</option>
                </select>
            </div>
            <div class="modal-footer">
                <button id="cancelAddToGroup">Отмена</button>
                <button class="btn-primary" id="confirmAddToGroup">Добавить</button>
            </div>
        </div>
    </div>

    <!-- ===== МОДАЛЬНОЕ ОКНО: ПРОГРЕСС СТУДЕНТА ===== -->
    <div class="modal-overlay" id="studentProgressModal">
        <div class="modal" style="max-width:600px;">
            <button class="modal-close" id="closeProgressModal"><i class="fas fa-times"></i></button>
            <div class="modal-title" id="progressStudentName">Прогресс студента</div>
            <div class="modal-body" id="progressBody">
                <!-- Заполняется динамически -->
            </div>
            <div class="modal-footer">
                <button id="closeProgressBtn">Закрыть</button>
            </div>
        </div>
    </div>

    <script>
        // ================================================================
        //   ДАННЫЕ
        // ================================================================

        const USER_KEY = 'profeng_user';
        const USERS_KEY = 'profeng_users';
        const GROUPS_KEY = 'profeng_groups';

        // Фиктивные данные для демонстрации прогресса студентов
        const DEMO_PROGRESS = {
            'anna.smirnova@mail.ru': {
                courses: [
                    { name: 'Medical English', progress: 75, topics: [
                        { name: 'Lesson 1: The Human Body', progress: 100 },
                        { name: 'Lesson 2: Skeletal System', progress: 100 },
                        { name: 'Lesson 3: Muscular System', progress: 60 },
                        { name: 'Lesson 4: Nervous System', progress: 0 },
                        { name: 'Lesson 5: Cardiovascular System', progress: 0 }
                    ]},
                    { name: 'Technical English', progress: 40, topics: [
                        { name: 'Lesson 1: Computer Basics', progress: 100 },
                        { name: 'Lesson 2: Programming', progress: 50 },
                        { name: 'Lesson 3: Networks', progress: 0 },
                        { name: 'Lesson 4: Cybersecurity', progress: 0 }
                    ]},
                    { name: 'Business English', progress: 20, topics: [
                        { name: 'Lesson 1: Business Meetings', progress: 100 },
                        { name: 'Lesson 2: Presentations', progress: 25 },
                        { name: 'Lesson 3: Business Writing', progress: 0 },
                        { name: 'Lesson 4: Negotiations', progress: 0 },
                        { name: 'Lesson 5: Business Ethics', progress: 0 }
                    ]}
                ]
            },
            'ivan.petrov@mail.ru': {
                courses: [
                    { name: 'Medical English', progress: 90, topics: [
                        { name: 'Lesson 1: The Human Body', progress: 100 },
                        { name: 'Lesson 2: Skeletal System', progress: 100 },
                        { name: 'Lesson 3: Muscular System', progress: 100 },
                        { name: 'Lesson 4: Nervous System', progress: 80 },
                        { name: 'Lesson 5: Cardiovascular System', progress: 70 }
                    ]}
                ]
            },
            'maria.ivanova@mail.ru': {
                courses: [
                    { name: 'Medical English', progress: 30, topics: [
                        { name: 'Lesson 1: The Human Body', progress: 100 },
                        { name: 'Lesson 2: Skeletal System', progress: 50 },
                        { name: 'Lesson 3: Muscular System', progress: 0 },
                        { name: 'Lesson 4: Nervous System', progress: 0 },
                        { name: 'Lesson 5: Cardiovascular System', progress: 0 }
                    ]},
                    { name: 'Business English', progress: 10, topics: [
                        { name: 'Lesson 1: Business Meetings', progress: 50 },
                        { name: 'Lesson 2: Presentations', progress: 0 },
                        { name: 'Lesson 3: Business Writing', progress: 0 },
                        { name: 'Lesson 4: Negotiations', progress: 0 },
                        { name: 'Lesson 5: Business Ethics', progress: 0 }
                    ]}
                ]
            }
        };

        // ================================================================
        //   РАБОТА С ХРАНИЛИЩЕМ
        // ================================================================

        function getUsers() {
            try {
                const data = localStorage.getItem(USERS_KEY);
                return data ? JSON.parse(data) : [];
            } catch { return []; }
        }

        function saveUsers(users) {
            localStorage.setItem(USERS_KEY, JSON.stringify(users));
        }

        function getGroups() {
            try {
                const data = localStorage.getItem(GROUPS_KEY);
                return data ? JSON.parse(data) : [];
            } catch { return []; }
        }

        function saveGroups(groups) {
            localStorage.setItem(GROUPS_KEY, JSON.stringify(groups));
        }

        function getCurrentUser() {
            try {
                const data = localStorage.getItem(USER_KEY);
                return data ? JSON.parse(data) : null;
            } catch { return null; }
        }

        // Инициализация тестовыми пользователями (если их нет)
        function initUsers() {
            let users = getUsers();
            if (users.length === 0) {
                users = [
                    { name: 'Анна Смирнова', email: 'anna.smirnova@mail.ru', role: 'student', registeredAt: new Date().toISOString() },
                    { name: 'Иван Петров', email: 'ivan.petrov@mail.ru', role: 'student', registeredAt: new Date().toISOString() },
                    { name: 'Мария Иванова', email: 'maria.ivanova@mail.ru', role: 'student', registeredAt: new Date().toISOString() },
                    { name: 'Преподаватель', email: 'teacher@mail.ru', role: 'teacher', registeredAt: new Date().toISOString() },
                    { name: 'Елена Козлова', email: 'elena.kozlova@mail.ru', role: 'student', registeredAt: new Date().toISOString() },
                    { name: 'Дмитрий Соколов', email: 'dmitry.sokolov@mail.ru', role: 'student', registeredAt: new Date().toISOString() }
                ];
                saveUsers(users);
            }

            // Если текущий пользователь не сохранён в общем списке — добавим
            const current = getCurrentUser();
            if (current) {
                const exists = users.some(u => u.email === current.email);
                if (!exists) {
                    users.push(current);
                    saveUsers(users);
                }
            }
        }

        // ================================================================
        //   ОТРИСОВКА
        // ================================================================

        function renderGroups() {
            const container = document.getElementById('groupList');
            const groups = getGroups();
            const currentUser = getCurrentUser();

            // Фильтруем группы только текущего преподавателя
            const myGroups = groups.filter(g => g.teacherEmail === currentUser.email);

            if (myGroups.length === 0) {
                container.innerHTML = `<div class="empty-groups">У вас пока нет групп. Создайте первую группу!</div>`;
                return;
            }

            let html = '';
            myGroups.forEach(group => {
                const students = group.students || [];
                html += `
                    <div class="group-card" data-group-id="${group.id}">
                        <div class="group-header">
                            <div class="group-name">
                                <i class="fas fa-folder" style="color:var(--accent2);"></i> ${group.name}
                                <span class="count">(${students.length} студ.)</span>
                            </div>
                            <div class="group-actions">
                                <button class="delete-group" onclick="deleteGroup('${group.id}')">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </div>
                        <div class="group-students">
                `;

                if (students.length === 0) {
                    html += `<div style="color:var(--muted);font-size:0.85rem;padding:8px 0;">Нет студентов</div>`;
                } else {
                    students.forEach(email => {
                        const user = getUsers().find(u => u.email === email);
                        const name = user ? user.name : email;
                        html += `
                            <div class="group-student-item">
                                <div class="student-info">
                                    <span>${name}</span>
                                    <span class="email">${email}</span>
                                </div>
                                <div class="student-actions">
                                    <button class="view-progress" onclick="viewStudentProgress('${email}')">
                                        <i class="fas fa-chart-line"></i> Прогресс
                                    </button>
                                    <button class="remove-btn" onclick="removeStudentFromGroup('${group.id}', '${email}')">
                                        <i class="fas fa-user-minus"></i>
                                    </button>
                                </div>
                            </div>
                        `;
                    });
                }

                html += `
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function renderSearchResults(query) {
            const container = document.getElementById('searchResults');
            const currentUser = getCurrentUser();

            if (!query.trim()) {
                container.innerHTML = `<div class="empty">Введите имя или email для поиска</div>`;
                return;
            }

            const users = getUsers();
            const q = query.toLowerCase().trim();
            const results = users.filter(u =>
                u.role === 'student' &&
                u.email !== currentUser.email &&
                (u.name.toLowerCase().includes(q) || u.email.toLowerCase().includes(q))
            );

            if (results.length === 0) {
                container.innerHTML = `<div class="empty">Студенты не найдены</div>`;
                return;
            }

            let html = '';
            results.forEach(user => {
                const initials = user.name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
                html += `
                    <div class="user-item">
                        <div class="user-info">
                            <div class="user-avatar-small">${initials}</div>
                            <div class="user-detail">
                                <span class="name">${user.name}</span>
                                <span class="email">${user.email}</span>
                            </div>
                        </div>
                        <div class="actions">
                            <button class="add-btn" onclick="openAddToGroup('${user.email}', '${user.name}')">
                                <i class="fas fa-user-plus"></i> В группу
                            </button>
                            <button class="view-btn" onclick="viewStudentProgress('${user.email}')">
                                <i class="fas fa-chart-line"></i>
                            </button>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // ================================================================
        //   ОПЕРАЦИИ С ГРУППАМИ
        // ================================================================

        function createGroup(name) {
            const currentUser = getCurrentUser();
            if (!currentUser) return;

            const groups = getGroups();
            const newGroup = {
                id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
                name: name.trim(),
                teacherEmail: currentUser.email,
                students: []
            };
            groups.push(newGroup);
            saveGroups(groups);
            renderGroups();
        }

        function deleteGroup(groupId) {
            if (!confirm('Удалить группу и всех студентов из неё?')) return;
            let groups = getGroups();
            groups = groups.filter(g => g.id !== groupId);
            saveGroups(groups);
            renderGroups();
        }

        function addStudentToGroup(studentEmail, groupId) {
            let groups = getGroups();
            const group = groups.find(g => g.id === groupId);
            if (!group) return alert('Группа не найдена');

            if (group.students.includes(studentEmail)) {
                alert('Этот студент уже в группе');
                return;
            }

            group.students.push(studentEmail);
            saveGroups(groups);
            renderGroups();
            // Обновить поиск, чтобы кнопка "В группу" исчезла/обновилась?
            // Просто перерисуем поиск
            const query = document.getElementById('searchInput').value;
            renderSearchResults(query);
        }

        function removeStudentFromGroup(groupId, studentEmail) {
            if (!confirm(`Удалить студента из группы?`)) return;
            let groups = getGroups();
            const group = groups.find(g => g.id === groupId);
            if (!group) return;
            group.students = group.students.filter(e => e !== studentEmail);
            saveGroups(groups);
            renderGroups();
        }

        // ================================================================
        //   МОДАЛЬНЫЕ ОКНА
        // ================================================================

        // --- Создание группы ---
        function showCreateGroupModal() {
            document.getElementById('createGroupModal').classList.add('active');
            document.getElementById('newGroupName').value = '';
            document.getElementById('newGroupName').focus();
        }

        function closeCreateGroupModal() {
            document.getElementById('createGroupModal').classList.remove('active');
        }

        document.getElementById('createGroupBtn').addEventListener('click', showCreateGroupModal);
        document.getElementById('closeCreateGroupModal').addEventListener('click', closeCreateGroupModal);
        document.getElementById('cancelCreateGroup').addEventListener('click', closeCreateGroupModal);

        document.getElementById('confirmCreateGroup').addEventListener('click', () => {
            const name = document.getElementById('newGroupName').value.trim();
            if (!name) {
                alert('Введите название группы');
                return;
            }
            createGroup(name);
            closeCreateGroupModal();
        });

        document.getElementById('newGroupName').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('confirmCreateGroup').click();
            }
        });

        // --- Добавление в группу ---
        let addToGroupStudentEmail = null;
        let addToGroupStudentName = null;

        function openAddToGroup(email, name) {
            const currentUser = getCurrentUser();
            const groups = getGroups().filter(g => g.teacherEmail === currentUser.email);

            if (groups.length === 0) {
                alert('У вас пока нет групп. Сначала создайте группу.');
                return;
            }

            addToGroupStudentEmail = email;
            addToGroupStudentName = name;

            document.getElementById('addStudentName').textContent = name;
            document.getElementById('addStudentEmail').textContent = email;

            const select = document.getElementById('groupSelect');
            select.innerHTML = '<option value="">-- Выберите группу --</option>';
            groups.forEach(g => {
                const option = document.createElement('option');
                option.value = g.id;
                option.textContent = `${g.name} (${g.students.length} студ.)`;
                select.appendChild(option);
            });

            document.getElementById('addToGroupModal').classList.add('active');
        }

        function closeAddToGroupModal() {
            document.getElementById('addToGroupModal').classList.remove('active');
            addToGroupStudentEmail = null;
            addToGroupStudentName = null;
        }

        document.getElementById('closeAddToGroupModal').addEventListener('click', closeAddToGroupModal);
        document.getElementById('cancelAddToGroup').addEventListener('click', closeAddToGroupModal);

        document.getElementById('confirmAddToGroup').addEventListener('click', () => {
            const groupId = document.getElementById('groupSelect').value;
            if (!groupId) {
                alert('Выберите группу');
                return;
            }
            if (addToGroupStudentEmail) {
                addStudentToGroup(addToGroupStudentEmail, groupId);
                closeAddToGroupModal();
            }
        });

        // --- Просмотр прогресса студента ---
        function viewStudentProgress(email) {
            const user = getUsers().find(u => u.email === email);
            const name = user ? user.name : email;
            document.getElementById('progressStudentName').textContent = `Прогресс: ${name}`;

            const progress = DEMO_PROGRESS[email] || null;
            const body = document.getElementById('progressBody');

            if (!progress || !progress.courses || progress.courses.length === 0) {
                body.innerHTML = `
                    <div style="text-align:center;padding:30px 0;color:var(--muted);">
                        <i class="fas fa-book-open" style="font-size:2rem;display:block;margin-bottom:12px;opacity:0.3;"></i>
                        У студента пока нет курсов.
                    </div>
                `;
            } else {
                let html = '';
                progress.courses.forEach(course => {
                    const pct = course.progress;
                    const color = pct >= 80 ? 'var(--green)' : pct >= 40 ? 'var(--orange)' : 'var(--red)';
                    html += `
                        <div style="margin-bottom:20px;border-bottom:1px solid var(--border);padding-bottom:16px;">
                            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
                                <strong style="font-size:0.95rem;">${course.name}</strong>
                                <span style="font-size:0.8rem;font-weight:600;color:${color};">${pct}%</span>
                            </div>
                            <div style="width:100%;height:4px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-bottom:10px;">
                                <div style="height:100%;width:${pct}%;background:${color};border-radius:99px;"></div>
                            </div>
                            <div style="display:flex;flex-direction:column;gap:4px;">
                    `;
                    course.topics.forEach(topic => {
                        const tPct = topic.progress;
                        const tColor = tPct >= 100 ? 'var(--green)' : tPct > 0 ? 'var(--orange)' : 'var(--muted)';
                        const icon = tPct >= 100 ? 'fa-check-circle' : tPct > 0 ? 'fa-spinner fa-pulse' : 'fa-circle';
                        html += `
                            <div style="display:flex;justify-content:space-between;align-items:center;font-size:0.85rem;padding:2px 0;">
                                <span style="display:flex;align-items:center;gap:8px;">
                                    <i class="fas ${icon}" style="color:${tColor};width:16px;"></i>
                                    ${topic.name}
                                </span>
                                <span style="color:${tColor};font-weight:500;font-size:0.75rem;">${tPct}%</span>
                            </div>
                        `;
                    });
                    html += `
                            </div>
                        </div>
                    `;
                });
                body.innerHTML = html;
            }

            document.getElementById('studentProgressModal').classList.add('active');
        }

        function closeProgressModal() {
            document.getElementById('studentProgressModal').classList.remove('active');
        }

        document.getElementById('closeProgressModal').addEventListener('click', closeProgressModal);
        document.getElementById('closeProgressBtn').addEventListener('click', closeProgressModal);

        // Закрытие модалок по клику на overlay
        document.querySelectorAll('.modal-overlay').forEach(overlay => {
            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) {
                    overlay.classList.remove('active');
                }
            });
        });

        // Закрытие по ESC
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                document.querySelectorAll('.modal-overlay.active').forEach(m => m.classList.remove('active'));
            }
        });

        // ================================================================
        //   ПОИСК (реал-тайм)
        // ================================================================

        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');

        function performSearch() {
            renderSearchResults(searchInput.value);
        }

        searchBtn.addEventListener('click', performSearch);
        searchInput.addEventListener('input', performSearch);
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') performSearch();
        });

        // ================================================================
        //   ВЫХОД
        // ================================================================

        document.getElementById('logoutBtn').addEventListener('click', () => {
            if (confirm('Вы уверены, что хотите выйти?')) {
                localStorage.removeItem(USER_KEY);
                window.location.href = 'index.html';
            }
        });

        // ================================================================
        //   ИНИЦИАЛИЗАЦИЯ
        // ================================================================

        function init() {
            // Инициализируем пользователей
            initUsers();

            // Проверяем текущего пользователя
            const user = getCurrentUser();
            if (!user) {
                alert('Пожалуйста, войдите в аккаунт.');
                window.location.href = 'index.html';
                return;
            }

            if (user.role !== 'teacher') {
                alert('Доступ запрещён. Эта страница только для преподавателей.');
                window.location.href = 'index.html';
                return;
            }

            // Заполняем профиль
            const initials = user.name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
            document.getElementById('profileAvatar').textContent = initials;
            document.getElementById('headerAvatar').textContent = initials;
            document.getElementById('profileName').textContent = user.name;
            document.getElementById('profileEmail').textContent = user.email;
            document.getElementById('headerName').textContent = user.name.split(' ')[0] || user.name;

            // Рендерим группы
            renderGroups();

            // Показываем приветствие в поиске
            document.getElementById('searchResults').innerHTML = `<div class="empty">Введите имя или email для поиска</div>`;
        }

        // ================================================================
        //   ТЕМА
        // ================================================================

        (function() {
            const html = document.documentElement;
            const toggle = document.getElementById('themeToggle');
            const saved = localStorage.getItem('theme') || 'dark';
            html.setAttribute('data-theme', saved);

            if (toggle) {
                toggle.addEventListener('click', () => {
                    const current = html.getAttribute('data-theme');
                    const next = current === 'dark' ? 'light' : 'dark';
                    html.setAttribute('data-theme', next);
                    localStorage.setItem('theme', next);
                });
            }
        })();

        // Запуск
        init();

        console.log('✅ Страница преподавателя загружена');
        console.log('👤 Пользователь:', getCurrentUser());
    </script>

</body>
</html>
