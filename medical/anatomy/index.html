<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anatomy — Medical English</title>
<script>(function(){try{document.documentElement.setAttribute('data-theme',localStorage.getItem('theme')||'dark');}catch(e){}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<link rel="stylesheet" href="../../assets/app.css">
<style>
  .sub-summary{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
  .sub-summary .pbar{flex:1;min-width:220px}
  .sub-stat{font-family:'JetBrains Mono',monospace;font-size:.76rem;color:var(--muted)}
</style>
</head>
<body class="page-bg">

<header class="app-header">
  <div class="app-header-inner">
    <a href="../../index.html" class="brand">
      <div class="brand-icon"><i class="fas fa-heartbeat"></i></div>
      <span class="brand-text">Medical <span>English</span></span>
    </a>
    <div class="header-right">
      <div class="header-right" id="headerUser"></div>
      <button class="theme-toggle" data-theme-toggle title="Сменить тему">
        <i class="fas fa-sun"></i>
        <i class="fas fa-moon"></i>
      </button>
      <a class="btn btn-ghost" href="../../index.html"><i class="fas fa-arrow-left"></i> К курсам</a>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="page-head">
    <h1 class="page-title">Anatomy<em>.</em></h1>
    <p class="page-sub">Строение тела человека: 35 тем со словарём, текстами, аудированием и практикой произношения.</p>

    <div class="panel" style="margin-top:24px">
      <div class="sub-summary">
        <div class="sub-stat" id="subStat">Прогресс по направлению</div>
        <div id="subBar" style="flex:1;min-width:220px"></div>
      </div>
    </div>

    <div class="search-field" style="margin-top:20px">
      <i class="fas fa-search"></i>
      <input type="text" class="input" id="topicSearch" placeholder="Найти тему" autocomplete="off">
    </div>
  </div>

  <div class="section-label"><h2>Темы</h2></div>
  <div class="topics-grid" id="topicsGrid"></div>
  <div class="empty" id="noResults" style="display:none;margin-bottom:60px">Тема не найдена.</div>
</div>

<footer class="app-footer">Professional English · Medical English · Anatomy</footer>

<script>
  window.APP_ROOT = '../../';
  window.SUBCOURSE = { course: 'medical', subcourse: 'anatomy' };
</script>
<script src="../../assets/config.js"></script>
<script src="../../assets/api.js"></script>
<script src="../../assets/catalog.js"></script>
<script src="../../assets/ui.js"></script>
<script>
(function () {
  'use strict';

  var COURSE_KEY = window.SUBCOURSE.course;
  var SUB_KEY = window.SUBCOURSE.subcourse;
  var course = CATALOG.findCourse(COURSE_KEY);
  var sub = CATALOG.findSubcourse(COURSE_KEY, SUB_KEY);
  var progress = {};

  var grid = document.getElementById('topicsGrid');
  var searchInput = document.getElementById('topicSearch');
  var noResults = document.getElementById('noResults');

  function topicCard(topic, index) {
    var key = CATALOG.topicKey(COURSE_KEY, SUB_KEY, topic.key);
    var pct = progress[key] || 0;

    var card = App.el('a', 'topic-card');
    card.href = topic.key + '.html';
    card.dataset.search = (topic.title + ' ' + topic.key).toLowerCase();

    var icon = topic.icon
      ? '<img src="images/icon/' + App.escape(topic.icon) + '" alt="" onerror="this.style.display=\'none\'">'
      : '<i class="fas fa-book"></i>';

    card.innerHTML =
      '<div class="topic-icon">' + icon + '</div>' +
      '<div class="topic-body">' +
      '<div class="topic-num">Урок ' + String(index + 1).padStart(2, '0') + '</div>' +
      '<div class="topic-name">' + App.escape(topic.title) + '</div>' +
      App.progressBar(pct) +
      '</div>';
    return card;
  }

  function renderTopics() {
    grid.innerHTML = '';
    sub.topics.forEach(function (topic, index) {
      grid.appendChild(topicCard(topic, index));
    });
    applyFilter();
  }

  function renderSummary() {
    var values = sub.topics.map(function (t) {
      return progress[CATALOG.topicKey(COURSE_KEY, SUB_KEY, t.key)] || 0;
    });
    var pct = App.average(values);
    var done = values.filter(function (p) { return p >= 100; }).length;
    var started = values.filter(function (p) { return p > 0; }).length;

    document.getElementById('subBar').innerHTML = App.progressBar(pct);
    document.getElementById('subStat').textContent =
      'Завершено ' + done + ' из ' + sub.topics.length + ' · начато ' + started;
  }

  function applyFilter() {
    var q = searchInput.value.trim().toLowerCase();
    var visible = 0;
    Array.prototype.forEach.call(grid.children, function (card) {
      var match = !q || card.dataset.search.indexOf(q) !== -1;
      card.style.display = match ? '' : 'none';
      if (match) visible++;
    });
    noResults.style.display = visible ? 'none' : '';
  }

  searchInput.addEventListener('input', applyFilter);

  document.addEventListener('DOMContentLoaded', async function () {
    App.theme.bind();
    renderTopics();
    renderSummary();

    await API.ready;
    App.showModeNotice();

    var user = null;
    try {
      user = await API.auth.currentUser();
    } catch (e) {
      console.error(e);
    }

    App.renderUserBox(document.getElementById('headerUser'), user);

    if (user) {
      try {
        progress = await App.progressMap();
        renderTopics();
        renderSummary();
      } catch (e) {
        console.error('Не удалось загрузить прогресс:', e);
      }
    }
  });
})();
</script>
</body>
</html>
