<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" width="800" height="900">
  <rect width="800" height="900" fill="#f8f9fa"/>
  
  <!-- Заголовок -->
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">Lower Respiratory Tract</text>
  
  <!-- Трахея -->
  <rect x="370" y="70" width="60" height="150" rx="5" fill="#d4a373" stroke="#8d6e5a" stroke-width="2"/>
  <!-- Трахейные кольца -->
  <line x1="370" y1="90" x2="430" y2="90" stroke="#8d6e5a" stroke-width="1.5"/>
  <line x1="370" y1="110" x2="430" y2="110" stroke="#8d6e5a" stroke-width="1.5"/>
  <line x1="370" y1="130" x2="430" y2="130" stroke="#8d6e5a" stroke-width="1.5"/>
  <line x1="370" y1="150" x2="430" y2="150" stroke="#8d6e5a" stroke-width="1.5"/>
  <line x1="370" y1="170" x2="430" y2="170" stroke="#8d6e5a" stroke-width="1.5"/>
  <line x1="370" y1="190" x2="430" y2="190" stroke="#8d6e5a" stroke-width="1.5"/>
  
  <!-- Карина (разветвление) -->
  <polygon points="370,220 430,220 400,250" fill="#d4a373" stroke="#8d6e5a" stroke-width="2"/>
  
  <!-- Правый главный бронх -->
  <path d="M400,240 L470,260 L490,310" fill="none" stroke="#d4a373" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M400,240 L470,260 L490,310" fill="none" stroke="#8d6e5a" stroke-width="2"/>
  
  <!-- Левый главный бронх -->
  <path d="M400,240 L330,260 L310,310" fill="none" stroke="#d4a373" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M400,240 L330,260 L310,310" fill="none" stroke="#8d6e5a" stroke-width="2"/>
  
  <!-- Правые долевые бронхи -->
  <path d="M490,310 L530,340 L550,390" fill="none" stroke="#d4a373" stroke-width="14" stroke-linecap="round"/>
  <path d="M490,310 L530,340 L550,390" fill="none" stroke="#8d6e5a" stroke-width="2"/>
  <path d="M490,310 L520,350 L530,410" fill="none" stroke="#d4a373" stroke-width="14" stroke-linecap="round"/>
  <path d="M490,310 L520,350 L530,410" fill="none" stroke="#8d6e5a" stroke-width="2"/>
  <path d="M490,310 L510,360 L510,430" fill="none" stroke="#d4a373" stroke-width="14" stroke-linecap="round"/>
  <path d="M490,310 L510,360 L510,430" fill="none" stroke="#8d6e5a" stroke-width="2"/>
  
  <!-- Левые долевые бронхи -->
  <path d="M310,310 L270,340 L250,390" fill="none" stroke="#d4a373" stroke-width="14" stroke-linecap="round"/>
  <path d="M310,310 L270,340 L250,390" fill="none" stroke="#8d6e5a" stroke-width="2"/>
  <path d="M310,310 L280,350 L270,410" fill="none" stroke="#d4a373" stroke-width="14" stroke-linecap="round"/>
  <path d="M310,310 L280,350 L270,410" fill="none" stroke="#8d6e5a" stroke-width="2"/>
  
  <!-- Бронхиолы (ветвление) -->
  <g stroke="#e07c5a" stroke-width="1.5" fill="none">
    <!-- Правые бронхиолы -->
    <path d="M550,390 L575,415 L590,440"/>
    <path d="M550,390 L580,420 L595,450"/>
    <path d="M530,410 L560,435 L580,460"/>
    <path d="M530,410 L555,440 L570,470"/>
    <path d="M510,430 L535,455 L555,480"/>
    <path d="M510,430 L530,460 L545,490"/>
    <!-- Левые бронхиолы -->
    <path d="M250,390 L225,415 L210,440"/>
    <path d="M250,390 L220,420 L205,450"/>
    <path d="M270,410 L240,435 L220,460"/>
    <path d="M270,410 L245,440 L230,470"/>
  </g>
  
  <!-- Альвеолы (скопления) -->
  <g fill="#f4a261" stroke="#e76f51" stroke-width="1.5">
    <circle cx="590" cy="440" r="15"/>
    <circle cx="595" cy="450" r="12"/>
    <circle cx="585" cy="460" r="14"/>
    <circle cx="580" cy="470" r="13"/>
    <circle cx="555" cy="480" r="15"/>
    <circle cx="545" cy="490" r="12"/>
    <circle cx="560" cy="495" r="14"/>
    <circle cx="210" cy="440" r="15"/>
    <circle cx="205" cy="450" r="12"/>
    <circle cx="215" cy="460" r="14"/>
    <circle cx="220" cy="470" r="13"/>
    <circle cx="245" cy="480" r="15"/>
    <circle cx="230" cy="490" r="12"/>
    <circle cx="240" cy="495" r="14"/>
  </g>
  
  <!-- Контуры лёгких -->
  <ellipse cx="530" cy="520" rx="140" ry="180" fill="#f4f1ea" stroke="#8d6e5a" stroke-width="3" stroke-dasharray="0"/>
  <ellipse cx="270" cy="520" rx="130" ry="180" fill="#f4f1ea" stroke="#8d6e5a" stroke-width="3"/>
  
  <!-- Плевра (двойная линия вокруг лёгких) -->
  <ellipse cx="530" cy="520" rx="155" ry="195" fill="none" stroke="#2a9d8f" stroke-width="2" stroke-dasharray="6,4"/>
  <ellipse cx="270" cy="520" rx="145" ry="195" fill="none" stroke="#2a9d8f" stroke-width="2" stroke-dasharray="6,4"/>
  
  <!-- Диафрагма -->
  <path d="M120,720 Q400,800 680,720" fill="none" stroke="#264653" stroke-width="5"/>
  <text x="400" y="780" font-family="Arial, sans-serif" font-size="18" fill="#264653" text-anchor="middle" font-weight="bold">Diaphragm</text>
  
  <!-- Подписи структур -->
  <text x="400" y="65" font-family="Arial, sans-serif" font-size="16" fill="#333" text-anchor="middle" font-weight="bold">Trachea</text>
  <text x="400" y="270" font-family="Arial, sans-serif" font-size="16" fill="#333" text-anchor="middle" font-weight="bold">Carina</text>
  
  <text x="560" y="240" font-family="Arial, sans-serif" font-size="16" fill="#333" text-anchor="middle" font-weight="bold">Right main bronchus</text>
  <text x="240" y="240" font-family="Arial, sans-serif" font-size="16" fill="#333" text-anchor="middle" font-weight="bold">Left main bronchus</text>
  
  <text x="640" y="360" font-family="Arial, sans-serif" font-size="16" fill="#333" text-anchor="middle" font-weight="bold">Lobar bronchi</text>
  <text x="160" y="360" font-family="Arial, sans-serif" font-size="16" fill="#333" text-anchor="middle" font-weight="bold">Lobar bronchi</text>
  
  <text x="650" y="530" font-family="Arial, sans-serif" font-size="16" fill="#333" text-anchor="middle" font-weight="bold">Bronchioles</text>
  <text x="150" y="530" font-family="Arial, sans-serif" font-size="16" fill="#333" text-anchor="middle" font-weight="bold">Bronchioles</text>
  
  <text x="650" y="580" font-family="Arial, sans-serif" font-size="16" fill="#333" text-anchor="middle" font-weight="bold">Alveoli</text>
  <text x="150" y="580" font-family="Arial, sans-serif" font-size="16" fill="#333" text-anchor="middle" font-weight="bold">Alveoli</text>
  
  <text x="530" y="735" font-family="Arial, sans-serif" font-size="16" fill="#333" text-anchor="middle" font-weight="bold">Right lung</text>
  <text x="270" y="735" font-family="Arial, sans-serif" font-size="16" fill="#333" text-anchor="middle" font-weight="bold">Left lung</text>
  
  <text x="780" y="520" font-family="Arial, sans-serif" font-size="16" fill="#2a9d8f" text-anchor="middle" font-weight="bold">Pleura (dashed)</text>
  
  <!-- Номера маркеров -->
  <circle cx="400" cy="60" r="14" fill="#e63946" />
  <text x="400" y="64" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="bold">1</text>
  
  <circle cx="400" cy="265" r="14" fill="#e63946" />
  <text x="400" y="269" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="bold">2</text>
  
  <circle cx="560" cy="235" r="14" fill="#e63946" />
  <text x="560" y="239" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="bold">3</text>
  
  <circle cx="240" cy="235" r="14" fill="#e63946" />
  <text x="240" y="239" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="bold">4</text>
  
  <circle cx="640" cy="355" r="14" fill="#e63946" />
  <text x="640" y="359" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="bold">5</text>
  
  <circle cx="160" cy="355" r="14" fill="#e63946" />
  <text x="160" y="359" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="bold">6</text>
  
  <circle cx="650" cy="525" r="14" fill="#e63946" />
  <text x="650" y="529" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="bold">7</text>
  
  <circle cx="150" cy="525" r="14" fill="#e63946" />
  <text x="150" y="529" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="bold">8</text>
  
  <circle cx="650" cy="575" r="14" fill="#e63946" />
  <text x="650" y="579" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="bold">9</text>
  
  <circle cx="150" cy="575" r="14" fill="#e63946" />
  <text x="150" y="579" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="bold">10</text>
  
  <circle cx="530" cy="730" r="14" fill="#e63946" />
  <text x="530" y="734" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="bold">11</text>
  
  <circle cx="270" cy="730" r="14" fill="#e63946" />
  <text x="270" y="734" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="bold">12</text>
</svg>